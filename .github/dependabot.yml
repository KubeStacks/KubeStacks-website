version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Types track the Node.js line the tooling runs on (see .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript up to 6.0.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'typescript']
      lint:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'typescript-eslint',
            'eslint-plugin-*',
            'prettier',
            'prettier-plugin-*',
            'globals',
          ]
      testing:
        patterns: ['@playwright/test', 'nyc', 'istanbul-lib-*', '@types/istanbul-lib-*']
      design:
        patterns: ['@fontsource-variable/*', 'lucide-static']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
